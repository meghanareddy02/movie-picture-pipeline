name: Backend CI

on:
  push:
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-ci.yaml"

  pull_request:
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-ci.yaml"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install pipenv
    pipenv install --system --deploy

      - name: Run tests
        run: pytest

      - name: Run lint
        run: flake8 .